apiVersion: v1
kind: ServiceAccount
metadata:
  name: observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observer-pods
subjects:
  - kind: ServiceAccount
    name: observer
    namespace: k8training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
