name: Publish versioned release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A replaced pending trigger is safe: each run drains all unreleased main merges.
concurrency:
  group: versioned-releases
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package and publish
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate unreleased merges and publish complete assets
        run: node scripts/release/publish.cjs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
          RELEASE_TOKEN_SOURCE: ${{ secrets.RELEASE_PUBLISH_TOKEN != '' && 'repository-secret' || 'github-token' }}
