version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels: [dependencies, patch]
    commit-message:
      prefix: 'deps'
    groups:
      compatible-npm-updates:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels: [dependencies, patch]
    commit-message:
      prefix: 'ci-deps'
    groups:
      compatible-action-updates:
        update-types: [minor, patch]
